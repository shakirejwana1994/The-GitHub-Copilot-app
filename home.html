<!DOCTYPE html>
<html lang="en">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker | Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" 
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style>
     *{
         font-family: "Geist", sans-serif;
     }
</style>


</head>
<body class="bg-white min-h-screen ">
    
    <nav><div class="navbar bg-base-200 shadow-sm  ">
  <div class="flex-1 px-10">
    <div class="flex ">
        <img class="max-w-9 min-h-8 sm:max-w-10 " src="assets/github-logo.png" alt="logo">
                <h3 class="font-normal sm:text-[14px] p-2 sm:p-1">GitHub Issues Tracker</h3>
              </div>
    
  </div>

  <div class="px-10 flex gap-2">
    <label class="input">
  <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width="2.5"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </g>
  </svg>
  <input id="search-btn" type="search"  placeholder="Search issues...." />
 </label>
 <button class="btn btn-active btn-primary">+ New Issue</button>
  </div>
  
    
    
 </nav>

 <main >
    <div class=" bg-base-200 mb-5 shadow-md max-w-[1110px] min-h-[88px]  mx-auto mt-8  rounded-md">
 
   <div >
    <div >
        <div class="flex-1 items-center  justify-center gap-2 rounded-sm mx-auto  px-4 py-5 " >
        <button id="tab-all"
        onclick="switchTab('all')"
         class=" tab-button px-4 sm:px-5 py-2 bg-blue-400 border border-gray-300
        rounded-md text-sm font-medium cursor-pointer" data-status="all" >
          All
        </button>
        
    
     <button id="tab-open"
        onclick="switchTab('open')" 
     class="tab-button px-4 sm:px-5 py-2 border border-gray-300 rounded-md text-sm font-medium cursor-pointer" >
        Open
    </button>
    <button id="tab-closed"
        onclick="switchTab('closed')"
     class="tab-button px-4 sm:px-5 py-2 border border-gray-300 rounded-md text-sm font-medium cursor-pointer" >
        Closed
    </button>
    </div>
     
      
    </div>
    
   
  </div>
 </div>

 </main>

 <section class="bg-base-200  mb-6 max-w-[1110px] min-h-[88px]  mx-auto shadow-sm">
    <div class="border border-slate-200  shadow-sm rounded-lg p-4 sm:p-5 md:px-10  flex flex-col items-start md:flex-row md:items-center justify-between  gap-4">
        <div class="left flex items-center justify-center  gap-2">
            <div  >
                <img class="w-8 h-8 " src="./assets/Aperture.png" alt="">
            </div>
            <div>
                <h3 class="text-sm font-bold">
                    <span id="issue-count">0</span>
                    Issues
                </h3>
                <p class="text-gray-500 text-sm" >
                   Track and Manage GitHub issues
                </p>
            </div>

        </div>

        <div class="flex gap-3 " >
         <div class="flex items-center gap-4" >  
           
           <span class=" bg-green-500 text-sm w-3 h-3 rounded-full" ></span> Open

         </div>
         <div class="flex gap-2 items-center " >  
           
           <span class=" bg-purple-700 text-sm w-3 h-3 rounded-full" ></span>Closed


         </div>
        </div>

    </div>

    <div id="issue-container" class="  grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-2 md:gap-2  lg:grid-cols-4 lg:gap-3 px-2  py-4 mx-1  ">
      
         </div>


      

 <dialog id="issue-modal" class="  modal modal-bottom sm:modal-middle">
  <div class="modal-box">
    <h3 id="modal-title" class="text-sm font-bold"></h3>
     <div id="modal-content" class="mt-5"></div>
    <div> <p id="modal-description"class=" py-4"></p></div>
   
    
    
    <div class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button id="" class="btn btn btn-primary">Close</button>
      </form>
    </div>
    
  </div>
 </dialog>

    <div id="loading-spinner" class="h-[60hv] flex hidden justify-center items-center">
        <span class="loading loading-bars loading-lg" > </span>
    </div>
 </section>







 <script src="script/home.js"></script>
</body>
</html>
